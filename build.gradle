def javaExampleProjects = subprojects.findAll {
	it.path.startsWith(':examples:lh-server:java:') && it.path.tokenize(':').size() == 4
}

tasks.register('buildJavaExamples') {
	group = 'examples'
	description = 'Build all Java lh-server example modules.'
	dependsOn(javaExampleProjects.collect { "${it.path}:build" })
}

tasks.register('runJavaExamples') {
	group = 'examples'
	description = 'Run all Java lh-server example applications.'
	dependsOn(':examples:lh-server:java:taskdef-app:run')
	dependsOn(':examples:lh-server:java:wfspec-app:run')
}
