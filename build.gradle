def javaExampleDirs = fileTree("${rootDir}/examples/lh-server/java") {
	include '**/build.gradle'
}.files.collect { it.parentFile }.sort { a, b -> a.path <=> b.path }

def independentBuilds = javaExampleDirs.collect { exampleDir ->
	tasks.register("build${exampleDir.name.replace('-', '_')}", GradleBuild) {
		dir = exampleDir
		tasks = ['build']
	}
}

def legacyRunDirs = javaExampleDirs.findAll { it.name in ['taskdef-app', 'wfspec-app'] }
def independentRuns = legacyRunDirs.collect { exampleDir ->
	tasks.register("run${exampleDir.name.replace('-', '_')}", GradleBuild) {
		dir = exampleDir
		tasks = ['run']
	}
}

tasks.register('buildJavaExamples') {
	group = 'examples'
	description = 'Build all Java lh-server example modules.'
	dependsOn(independentBuilds)
}

tasks.register('runJavaExamples') {
	group = 'examples'
	description = 'Run all Java lh-server example applications.'
	dependsOn(independentRuns)
}
