plugins {
    id 'application'
}

repositories {
    mavenCentral()
}

dependencies {
    implementation libs.littlehorse.client
    implementation 'org.slf4j:slf4j-api:2.0.17'
    runtimeOnly 'org.slf4j:slf4j-simple:2.0.17'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

application {
    mainClass = 'io.littlehorse.examples.InterruptsExample'
}
