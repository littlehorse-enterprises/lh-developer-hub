plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.5'
}

group = 'io.littlehorse.examples'
version = '1.0.0'

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web:3.5.5'
    implementation 'io.littlehorse:littlehorse-client:1.2.1'

    testImplementation 'org.springframework.boot:spring-boot-starter-test:3.5.5'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

tasks.named('test') {
    useJUnitPlatform()
}
